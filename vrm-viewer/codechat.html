<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>AI Coding Assistant</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --panel: #252526;
            --panel-2: #2d2d30;
            --border: #3a3a3d;
            --text: #e6e6e6;
            --text-dim: #9a9a9a;
            --accent: #3b82f6;
            --accent-dim: #1e3a63;
            --user-bubble: #2b3a55;
            --ai-bubble: #2a2a2c;
            --code-bg: #141415;
            --danger: #e05252;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, "Segoe UI", Pretendard, sans-serif;
            font-size: 14px;
        }

        #app {
            display: grid;
            grid-template-columns: 260px 1fr;
            height: 100vh;
        }

        /* ── Sidebar ── */
        #sidebar {
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
        }

        #sidebar h1 {
            font-size: 14px;
            margin: 4px 0 8px 4px;
            color: var(--text-dim);
            font-weight: 600;
        }

        .sidebar-btn {
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
        }

        .sidebar-btn:hover {
            background: #333336;
        }

        #file-info {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-dim);
            padding: 8px;
            background: var(--panel-2);
            border-radius: 8px;
            word-break: break-all;
            min-height: 40px;
        }

        #model-row {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #model-row label {
            font-size: 11px;
            color: var(--text-dim);
        }

        #model-input,
        #ollama-url-input {
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 12px;
        }

        /* ── Main column ── */
        #main {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        #titlebar {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
            display: inline-block;
            margin-right: 6px;
        }

        #status-dot.ok {
            background: #4ade80;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .msg.user {
            align-self: flex-end;
            background: var(--user-bubble);
        }

        .msg.ai {
            align-self: flex-start;
            background: var(--ai-bubble);
        }

        .msg.lily {
            align-self: flex-start;
            background: #1b2a44;
            border: 1px solid #3b5fa8;
            /* thick left accent bar so the bubble reads as "Lily" at a
               glance even in a compact layout, without depending on the
               (subtle, dark) top/right/bottom border being visible */
            border-left: 4px solid #8ab4f8;
        }

        /* Code blocks inside a Lily bubble get their own tint + border,
           independent of the outer bubble's border. A long code block
           fills almost the whole bubble and scrolls the header/border
           out of view, so without this the block just shows the
           near-black --code-bg and looks like a normal, uncolored AI
           reply. This keeps the blue visible no matter how far you've
           scrolled into the block. */
        .msg.lily .code-block pre {
            background: rgba(59, 95, 168, 0.14);
            border-color: #3b5fa8;
        }

        .msg.lily .code-block pre code {
            color: #8ab4f8;
        }

        /* Swap to a lime accent instead of blue by uncommenting these
           and commenting out the light-blue rules above:
        .msg.lily { border-left: 4px solid #a6e22e; }
        .msg.lily .code-block pre { background: rgba(166, 226, 46, 0.10); border-color: #6b8f22; }
        .msg.lily .code-block pre code { color: #c3f77a; }
        */

        .lily-bubble-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #8ab4f8;
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            /* keeps the "LILY" label pinned to the top of the bubble
               even when the bubble's content scrolls internally, so it
               never disappears above the visible area on a long
               code block */
            position: sticky;
            top: 0;
            background: #1b2a44;
            z-index: 1;
            padding-top: 2px;
        }

        .lily-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4f7fff;
            box-shadow: 0 0 6px rgba(79, 127, 255, 0.8);
            display: inline-block;
        }

        .msg.system {
            align-self: center;
            color: var(--text-dim);
            font-size: 12px;
            background: none;
        }

        .sent-attachments {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 4px;
        }

        .code-block {
            position: relative;
            margin: 8px 0;
        }

        .code-block pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            overflow-x: auto;
            font-family: "SF Mono", Consolas, "Cascadia Code", monospace;
            font-size: 12.5px;
            margin: 0;
        }

        .code-block-actions {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            gap: 5px;
        }

        .code-copy-btn {
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        .code-copy-btn:hover {
            color: var(--text);
        }

        .code-save-btn {
            border-color: var(--accent);
            color: #8ab4f8;
        }

        .code-edit-textarea {
            width: 100%;
            background: var(--code-bg);
            border: 1px solid var(--accent);
            border-radius: 8px;
            color: var(--text);
            font-family: "SF Mono", Consolas, "Cascadia Code", monospace;
            font-size: 12.5px;
            padding: 12px 14px;
            resize: vertical;
        }

        /* ── Attachment tray ── */
        #attachment-tray {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 16px 0 16px;
        }

        .attachment-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 12px;
            max-width: 180px;
        }

        .attachment-chip img {
            width: 24px;
            height: 24px;
            object-fit: cover;
            border-radius: 4px;
        }

        .attachment-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .attachment-remove {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 0 2px;
            font-size: 13px;
        }

        .attachment-remove:hover {
            color: var(--text);
        }

        #composer {
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        #attach-btn {
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text-dim);
            width: 42px;
            height: 42px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            flex-shrink: 0;
        }

        #attach-btn:hover {
            color: var(--text);
            background: #333336;
        }

        #input {
            flex: 1;
            resize: none;
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            padding: 10px 12px;
            font-family: inherit;
            font-size: 14px;
            max-height: 200px;
            min-height: 42px;
        }

        #send-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        #send-btn:disabled {
            background: var(--accent-dim);
            cursor: default;
        }
    </style>
</head>



<body>
    <div id="app">
        <div id="sidebar">
            <h1>AI Coding Assistant</h1>
            <button class="sidebar-btn" id="open-file-btn">📂 Open File</button>
            <button class="sidebar-btn" id="save-file-btn">💾 Save Current Code</button>
            <button class="sidebar-btn" id="clear-btn">🗑 Clear Chat</button>
            <div id="file-info">No file open</div>

            <div id="model-row">
                <label for="ollama-url-input">Ollama URL</label>
                <input id="ollama-url-input" value="http://127.0.0.1:11434" />
                <label for="model-input">Model</label>
                <input id="model-input" value="qwen2.5:7b" />
            </div>
        </div>

        <div id="main">
            <div id="titlebar">
                <span><span id="status-dot"></span><span id="status-text">Checking Ollama…</span></span>
                <span id="active-file-name"></span>
            </div>
            <div id="messages"></div>
            <div id="attachment-tray"></div>
            <input type="file" id="file-attach-input" multiple style="display:none;"
                accept=".js,.ts,.py,.json,.html,.css,.md,.txt,.jsx,.tsx,.java,.c,.cpp,.go,.rs,.yml,.yaml,.sh,image/*" />
            <div id="composer">
                <button id="attach-btn" title="Attach files or images">📎</button>
                <textarea id="input"
                    placeholder="Ask for help, paste code to edit, or describe what you want built… (Enter to send, Shift+Enter for newline)"></textarea>
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script src="codechat.js"></script>
</body>

</html>
